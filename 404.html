<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada - Arranca Laboral</title>
  <meta name="description" content="Lo sentimos, la página que buscas no existe. Regresa al inicio o contáctanos.">
  <link rel="icon" type="image/png" href="img/favicon-64x64.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .error-container {
      text-align: center;
      max-width: 500px;
    }
    h1 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 6rem;
      font-weight: 800;
      color: #22c55e;
      margin-bottom: 1rem;
    }
    h2 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.5rem;
      color: white;
      margin-bottom: 1rem;
    }
    p {
      color: rgba(255,255,255,0.7);
      margin-bottom: 2rem;
    }
    .btn-home {
      background: #22c55e;
      color: white;
      padding: 0.8rem 2rem;
      border-radius: 100px;
      text-decoration: none;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s;
    }
    .btn-home:hover {
      background: #16a34a;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="error-container">
    <h1>404</h1>
    <h2>Página no encontrada</h2>
    <p>Lo sentimos, la página que buscas no existe o fue movida.</p>
    <a href="/" class="btn-home">
      <i class="fas fa-home"></i> Volver al inicio
    </a>
  </div>
</body>
</html>
